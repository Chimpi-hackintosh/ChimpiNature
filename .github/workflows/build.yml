name: Build e Release do ChimpiNature
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar ChimpiNature
        run: gradle --no-daemon build --stacktrace
      - name: Salvar JAR nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ChimpiNature-1.0.0
          path: |
            build/libs/ChimpiNature-1.0.0.jar
            ChimpiNature_Shaderpack.zip
          if-no-files-found: error
      - name: Criar Release v1.0.0 com JAR e shaders
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ChimpiNature v1.0.0
          body: |
            ChimpiNature para Minecraft Java 1.20.1 + Fabric
            Inclui vento ambiente com tecla V, tres novas comidas craftaveis e shaderpack opcional
            Instale Fabric Loader e Fabric API 1.20.1 para utilizar o mod
            Shaderpack separado, requer Iris compativel e ainda nao foi validado no jogo
          files: |
            build/libs/ChimpiNature-1.0.0.jar
            ChimpiNature_Shaderpack.zip
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
